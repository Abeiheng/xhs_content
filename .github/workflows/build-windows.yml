name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'src/**'
      - 'resources/**'
      - 'build/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '*config*'
      - 'electron-builder.yml'
      - 'README.md'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match package.json version v$version" }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Windows MCP binary
        run: pnpm setup:mcp win32-x64
      - name: Check code
        run: |
          pnpm lint
          pnpm test
          pnpm typecheck
      - name: Build Windows x64 installer
        run: pnpm build:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: xiaohongshu-windows-x64-${{ github.sha }}
          path: |
            dist/*-windows-x64-setup.exe
            dist/*-windows-x64-setup.exe.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xiaohongshu-windows-x64-${{ github.sha }}
          path: release
      - name: Prepare draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
